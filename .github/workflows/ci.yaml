name: CI
on: [push, pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      # Make sure that `git describe` (used by Hatch to dynamically generate the version) knows the Git history, but no data about trees/blobs is needed.
      - run: git fetch --prune --unshallow --filter=tree:0
      - run: python3 -m pip install --editable . --group types
      - uses: pre-commit/action@v3.0.1

  test-yaml:
    runs-on: ubuntu-latest
    container: ragnargrootkoerkamp/bapctools
    steps:
      - uses: actions/checkout@v6
      - run: bash test/yaml/validate_yaml.sh

  test-ubuntu:
    runs-on: ubuntu-latest
    container: ragnargrootkoerkamp/bapctools
    steps:
      - uses: actions/checkout@v6
      - run: git config --global --add safe.directory "$(pwd)"
      - run: git fetch --prune --unshallow --filter=tree:0
      - run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -e .
          pip install pytest
          pip install PyYAML
          pytest

  test-wsl:
    runs-on: windows-latest
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
      - run: git fetch --prune --unshallow --filter=tree:0
      - uses: Vampire/setup-wsl@v6
        with:
            distribution: Ubuntu-24.04
            wsl-version: 2
            additional-packages:
                python3
                python3-pip
                python3-venv
                pypy3
                build-essential
                default-jre
                default-jdk
                kotlin
                texlive
                texlive-latex-base
                texlive-latex-recommended
                texlive-latex-extra
                lmodern
                texlive-science
                latexmk
                texlive-lang-german
                asymptote
      - shell: wsl-bash {0}
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install vermin
          pip install checktestdata
          pip install -e .
          pip install pytest
          pip install PyYAML
          pytest
