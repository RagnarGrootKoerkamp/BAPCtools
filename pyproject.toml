[project]
name = "bapctools"
dynamic = ["version"]
authors = [
    { name="Ragnar Groot Koerkamp", email="ragnar.grootkoerkamp@gmail.com" },
]
description = "Tools for developing ICPC-style programming contest problems."
readme = "readme.md"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0"
license-files = ["LICENSE"]
dependencies = [
    "argcomplete>=3.0",
    "checktestdata>=2026.8.0",
    "colorama>=0.4.6",
    "matplotlib>=3.5",
    "Pygments>=2.17",
    "python-dateutil>=2.8.2",
    "questionary>=2",
    "requests>=2.25.1",
    "ruamel.yaml>=0.17.16",
    "vermin==1.8.0", # We define our own typing stubs, better use the exact version just to be sure it doesn't break.
    "typing_extensions>=4.10.0",
]

[project.scripts]
bt = "bapctools.cli:main"

[project.urls]
Homepage = "https://github.com/ragnargrootkoerkamp/bapctools"
Issues = "https://github.com/ragnargrootkoerkamp/bapctools/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    {include-group = "types"},
]
types = [
    "mypy>=1.19",
    "types-colorama>=0.4.6",
    "types-Pygments>=2.17",
    "types-python-dateutil>=2.8.2",
    "types-requests>=2.25.1",
]

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I", # Enable import sorting rules
    "UP", # Enable upgrade rules
    "N", # Enable PEP8 naming conventions
    "PERF", # Enable perf checks
    "E", # Enable codestyle checks
    "W", # Enable codestyle checks

]
ignore = [
    "UP036", # Allow Python version checks
    "UP045", # Allow Optional
    "PERF203", # Allow try-except in a loop
    "E501", # Allow too long lines
]

[tool.ruff.lint.isort]
# Case-insensitive ordering in `from ? import X, y, Z`
order-by-type = false

[tool.pyright]
include = ["bapctools"]
exclude = ["bapctools/resources"]

[tool.mypy]
python_version = "3.10"
packages = "bapctools"
exclude = ["^bapctools/resources/"]
check_untyped_defs = true
enable_error_code="truthy-bool,truthy-iterable"
strict = true
mypy_path = ["third_party/stubs/"]

[[tool.mypy.overrides]]
# These files contain platform-specific type: ignore comments (macOS/Linux
# differ on sched_*, nullcontext typing, and return type inference) that are
# unused on the other platform. Suppress the resulting unused-ignore warnings.
module = ["bapctools.parallel", "bapctools.util", "bapctools.interactive", "bapctools.run"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["test"]
